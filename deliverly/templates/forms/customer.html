{% extends 'base.html' %}

{% block header %}
    <h1>{% block title %}New Customer Registration{% endblock %}</h1>
{% endblock %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-center">
        <div class="col-12 col-md-6 col-lg-4">
            <form id="customer_reg" class="p-4 needs-validation" action="{{ url_for('forms.new_customer_form') }}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="firstName">First Name</label>
                    <input class="form-control" id="firstName" type="text" name="first_name" required>

                </div>
                <div class="mb-3">
                    <label class='form-label' for="lastName">Last Name</label>
                    <input class="form-control" id="lastName" type="text" name="last_name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" type="email" placeholder="Enter Email" name="email" required>
                    <div class="invalid-feedback">
                        Invalid Email!
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-12 mb-3">
                        <label class="form-label" for="address">Address</label>
                        <input class="form-control" id="address" type="text" placeholder="Ex: 123 Candy Street" name="address" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="suburb">Suburb</label>
                        <input class="form-control" id="suburb" type="text" placeholder="Ex: Perth" name="suburb" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="postcode">Postcode</label>
                        <input class="form-control" id="postcode" type="text" placeholder="Ex: 6000" name="postcode" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input class="form-control" id="phone" type="tel" pattern="\([0-9]{2}\) [0-9]{8}" placeholder="(08) 90000000" name="phone" required>
                    <div class="invalid-feedback">
                        Invalid Number!
                    </div>
                </div>
                <div class="d-flex mb-3 justify-content-center">
                    <button class="btn btn-primary" type="submit" value="Submit">Register</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/form_validation.js') }}"></script>
{% endblock %}
