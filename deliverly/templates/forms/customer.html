{% extends 'base.html' %}

{% block header %}
    <h1>{% block title %}New Customer Registration{% endblock %}</h1>
{% endblock %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-center">
        <div class="col-12 col-md-6 col-lg-4">
            <form id="customer_reg" class="p-4 needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="firstName">First Name</label>
                    <input class="form-control" id="firstName" type="text"  required>

                </div>
                <div class="mb-3">
                    <label class='form-label' for="lastName">Last Name</label>
                    <input class="form-control" id="lastName" type="text" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" type="email" placeholder="Enter Email" required>
                    <div class="invalid-feedback">
                        Invalid Email!
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-12 mb-3">
                        <label class="form-label" for="address">Address</label>
                        <input class="form-control" id="address" type="text" placeholder="Ex: 123 Candy Street" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="suburb">Suburb</label>
                        <input class="form-control" id="suburb" type="text" placeholder="Ex: Perth" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="postcode">Postcode</label>
                        <input class="form-control" id="postcode" type="text" placeholder="Ex: 6000" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input class="form-control" id="phone" type="tel" placeholder="0400 000 000" required>
                    <div class="invalid-feedback">
                        Invalid Number!
                    </div>
                </div>
                <div class="d-flex mb-3 justify-content-center">
                    <button class="btn btn-primary" type="submit">Register</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
