{% extends 'base.html' %}

{% block header %}
    <h1>{% block title %}New Menu Item{% endblock %}</h1>
{% endblock %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-center">
        <div class="col-12 col-md-6 col-lg-4">
            <form id="dish_reg" class="p-4 needs-validation" action="{{ url_for('forms.new_dish_form') }}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="restaurantID">For which restaurant?</label>
                    <select class="form-select" id="restaurantID" name="restaurant_id" required>
                        <option selected disabled value="">Choose...</option>
                        {% for id, name in restaurants %}
                        <option value="{{ id }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="dishName">Dish Name</label>
                    <input class="form-control" id="dishName" type="text" name="dish_name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="dishPrice">Dish Price</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input class="form-control" id="dishPrice" type="number" min="0.01" step="0.01" placeholder="0.00" name="dish_price" required>
                        <div class="invalid-feedback">
                            Invalid Price!
                        </div>
                    </div>
                </div>
                <div class="d-flex mb-3 justify-content-center">
                    <button class="btn btn-primary" type="submit" value="Submit">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/form_validation.js') }}"></script>
{% endblock %}
