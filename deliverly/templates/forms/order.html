{% extends 'base.html' %}

{% block header %}
    <h1>{% block title %}New Order{% endblock %}</h1>
{% endblock %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-center">
        <div class="col-12 col-md-6 col-lg-4">
            <form id="order_reg" class="p-4 needs-validation" action="{{ url_for('forms.new_order_form') }}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="customerID">For which customer?</label>
                    <select class="form-select" id="customerID" name="customer_id" required>
                        <option selected disabled value="">Choose...</option>
                        {% for id, name in customers %}
                        <option value="{{ id }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="restaurantID">For which restaurant?</label>
                    <select class="form-select" id="restaurantID" name="restaurant_id" required>
                        <option selected disabled value="">Choose...</option>
                        {% for id, name in restaurants %}
                        <option value="{{ id }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="dishs">Dishs</label>
                    <select id="dishs" class="form-select" data-clearable="true" data-searchable="true" data-dishes-url="{{ url_for('forms.get_dishes') }}" name="dishs" multiple disabled required>
                        <option value="" disabled>--- Choose ---</option>
                    </select>
                </div>
                <div class="mb-3">
                    <table id="cart" class="table table-bordered table-striped">
                        <thead>
                            <tr class="table-primary">
                                <th scope="col">Dish Name</th>
                                <th scope="col">Dish Price</th>
                                <th scope="col">Quantity</th>
                            </tr>
                        </thead>
                        <tbody id="cartBody">

                        </tbody>
                    </table>
                </div>
                <div class="row align-items-center">
                    <label for="fee" class="col-4 col-form-label">Delivery Fee</label>
                    <div class="col-8">
                        <input type="text" readonly="" class="form-control-plaintext" id="fee" value="$5.95">
                    </div>
                </div>
                <div class="row align-items-center">
                    <label for="total" class="col-4 col-form-label">Total</label>
                    <div class="col-8">
                        <input type="text" readonly="" class="form-control-plaintext" id="total" value="$0.00">
                    </div>
                </div>
                <div class="d-flex mb-3 justify-content-center">
                    <button class="btn btn-primary" type="submit" value="Submit">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/form_validation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/order_form.js', v=2) }}"></script>
{% endblock %}
