{% extends 'base.html' %}

{% block header %}
    <h1>{% block title %}New Restaurant Registration{% endblock %}</h1>
{% endblock %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-center">
        <div class="col-12 col-md-6 col-lg-4">
            <form id="restaurant_reg" class="p-4 needs-validation" action="{{ url_for('forms.new_restaurant_form') }}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="restaurantName">Restaurant Name</label>
                    <input class="form-control" id="restaurantName" type="text" name="restaurant_name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="address">Address</label>
                    <input class="form-control" id="address" type="text" placeholder="Ex: 123 Candy Street" name="address" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input class="form-control" id="phone" type="tel" pattern="\([0-9]{2}\) [0-9]{8}" placeholder="(08) 90000000" name="phone" required>
                    <div class="invalid-feedback">
                        Invalid Number!
                    </div>
                </div>
                <div class="d-flex mb-3 justify-content-center">
                    <button class="btn btn-primary" type="submit" value="Submit">Register</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/form_validation.js') }}"></script>
{% endblock %}
