{% extends 'base.html' %}

{% block header %}
    <h1 class="page-head">{% block title %}Database viewer{% endblock %}</h1>
{% endblock %}

{% block content %}
    <table cellspacing="0" width="100%">
        <thead>
            <tr>
            {% for c in columns %}
                <th scope="col">{{c}}</th>
            {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
            <tr>
                {% for col in row %}
                <td>{{col}}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
